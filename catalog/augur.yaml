apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: events-api
  title: Events API
  description: "Notifications for the Shell's stream, and AUGUR's audit log. People reach it through the gateway, which passes the caller in x-user-* headers. Services call it on the internal network (see @augur/service-kit: notify, recordAudit). An app's service signs in as itself (a bearer token for its Keycloak client app-<id>, audience platform-services), may send only for itself, and needs the scope (notifications:send, audit:write) that the registry grants it on the floor named by x-workspace-id; otherwise 403, or 503 while that can't be checked. Platform services sign in the same way as their own clients (platform-<name>). A service call that names a floor (x-workspace-id) records it, with the floor's path from the root as it stands then (asked of identity), on each notification and audit entry: 400 for a floor that doesn't exist, 503 while identity can't be reached."
  annotations:
    github.com/project-slug: harry-burton-dev/augur
    augur.dev/contract-version: 1.15.0
spec:
  type: openapi
  lifecycle: production
  owner: group:default/augur-core
  system: augur-platform
  definition:
    $text: ../contracts/events.openapi.yaml
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: gateway-api
  title: Gateway API
  description: The gateway's own API, beside the services it forwards to. Reached at /api/gateway/v1 by a signed-in caller. Everything else under /api/<service> is forwarded to that service with the caller in x-user-* headers and in x-augur-caller, a token the gateway signs (EdDSA, one minute) for that service alone (its `aud` is the service's name), and without the caller's Authorization header. Services that check callers believe only the signed one. Every path but /healthz and /caller-keys needs a signed-in caller, however it is spelt. x-user-signed-in-at (and the token's `signedInAt`) carries when the caller last entered their password (the token's auth_time, ISO 8601), for a service that wants a fresh sign-in for something drastic; the shell's /auth/again?return=<path> asks for the password and comes back.
  annotations:
    github.com/project-slug: harry-burton-dev/augur
    augur.dev/contract-version: 1.8.0
spec:
  type: openapi
  lifecycle: production
  owner: group:default/augur-core
  system: augur-platform
  definition:
    $text: ../contracts/gateway.openapi.yaml
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: identity-api
  title: Identity API
  description: Who people are. Reached through the gateway, which verifies the caller's sign-in token and passes the caller on in x-user-* headers. The /admin paths manage people and roles, kept in the sign-in provider (Keycloak), and departments, which are identity's own teams (copied in once from the provider's groups). Every /admin path answers 403 to a caller without the admin role, and 503 when identity isn't connected to the provider. Changes are audited, never a password. /organisation is the organisation's name, time zone and email sender (ADR 0042), for anyone signed in and any service; only an admin changes them.
  annotations:
    github.com/project-slug: harry-burton-dev/augur
    augur.dev/contract-version: 1.30.1
spec:
  type: openapi
  lifecycle: production
  owner: group:default/augur-core
  system: augur-platform
  definition:
    $text: ../contracts/identity.openapi.yaml
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: models-api
  title: Models API
  description: |-
    The model gateway: the only place AUGUR keeps a model provider's key. It speaks the OpenAI-style chat completions API to whichever provider the server is set up with (MODEL_API_URL: OpenRouter, a LiteLLM proxy, any compatible API, or the built-in stand-in model), so nothing else holds an AI key or knows the provider.
    Two kinds of caller. An app's service signs in as itself (a bearer token for its Keycloak client app-<id>, audience platform-services) and needs models:use granted by the registry on the floor named by x-workspace-id. A person reaches it through the gateway (caller in x-user-* headers) from the shell's Agents, naming the agent they are talking to: "assistant", the shell's own, or an AI app granted models:use on their floor.
    Apps' services may also turn text into vectors (/embeddings, 1.1), to match by meaning, when an embedding model is set up (MODEL_EMBEDDING_NAME; the stand-in always has one). Each request counts as one call and is recorded as model.embedded, with how many texts and never what they say.
    Every call is written to the audit log (model.called, with the model, how many messages and which tools, never what was said) before it is made; a call that can't be recorded isn't made (503). Each app (the shell's assistant counts as one) gets a number of calls a day, UTC (429 after). Models are off until an admin turns them on (403 while off).
  annotations:
    github.com/project-slug: harry-burton-dev/augur
    augur.dev/contract-version: 1.1.0
spec:
  type: openapi
  lifecycle: production
  owner: group:default/augur-core
  system: augur-platform
  definition:
    $text: ../contracts/models.openapi.yaml
